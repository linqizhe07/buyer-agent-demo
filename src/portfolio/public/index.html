<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>组合 · agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" />
<link rel="stylesheet" href="/portfolio.css" />
</head>
<body>
<main>
  <header class="top">
    <div class="mono dim" id="stamp">—</div>
    <div class="modes">
      <div class="seg" id="mode"><button type="button" data-mode="open" aria-pressed="false">Open</button><button type="button" data-mode="guard" aria-pressed="false">Guard</button></div>
      <div class="mono dim small" id="mode-note"></div>
    </div>
  </header>

  <section class="worth">
    <div class="num" id="total">—</div>
    <div class="sub dim" id="today">—</div>
  </section>

  <section class="alloc">
    <div class="bar" id="alloc-bar"></div>
    <div class="legend mono" id="alloc-legend"></div>
    <div class="liq" id="liquidity"></div>
  </section>

  <section>
    <table id="accounts">
      <thead><tr><th>账户</th><th class="type">类型</th><th class="r">余额</th><th class="pad">agent 可以</th><th class="sw"></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="say">
    <h2>跟 agent 说</h2>
    <form id="say-form">
      <label for="say" class="sr">跟 agent 说</label>
      <input id="say" type="text" placeholder="再平衡 · 付 200 给 GitHub · 申购 1000 OUSG …" autocomplete="off" />
      <button type="submit" class="ink">说</button>
    </form>
    <div class="chips" id="chips"></div>
  </section>

  <section class="log">
    <h2>agent 今天</h2>
    <div id="turns"></div>
  </section>

  <footer class="mono dim small" id="foot"></footer>
</main>
<script src="/portfolio.js"></script>
</body>
</html>
