<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio · agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" />
<link rel="stylesheet" href="/portfolio.css" />
</head>
<body>
<main>
  <header class="top">
    <div class="mono dim" id="stamp">—</div>
    <div class="modes">
      <div class="seg" id="mode"><button type="button" data-mode="open" aria-pressed="false">Open</button><button type="button" data-mode="guard" aria-pressed="false">Guard</button></div>
      <div class="mono dim small" id="mode-note"></div>
    </div>
  </header>

  <section class="worth">
    <div class="num" id="total">—</div>
    <div class="sub dim" id="today">—</div>
  </section>

  <section class="alloc">
    <div class="bar" id="alloc-bar"></div>
    <div class="legend mono" id="alloc-legend"></div>
    <div class="liq" id="liquidity"></div>
  </section>

  <section>
    <table id="accounts">
      <thead><tr><th>Account</th><th class="type">Type</th><th class="r">Balance</th><th class="pad">Agent may</th><th class="sw"></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="say">
    <h2>Tell the agent</h2>
    <form id="say-form">
      <label for="say" class="sr">Tell the agent</label>
      <input id="say" type="text" placeholder="Rebalance · pay 200 to GitHub · sell 1 ETH · buy 500 YES Fed hike …" autocomplete="off" />
      <button type="submit" class="ink">Send</button>
    </form>
    <div class="chips" id="chips"></div>
  </section>

  <section class="log">
    <h2>Agent today</h2>
    <div id="turns"></div>
  </section>

  <footer class="mono dim small" id="foot"></footer>
</main>
<script src="/portfolio.js"></script>
</body>
</html>
