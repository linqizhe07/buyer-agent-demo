<!doctype html>
<html lang="en" data-theme="cream">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Account</title>
<script>/* the background before the first paint: Cream, unless this browser chose Black */
(function () { var t = "cream"; try { t = localStorage.getItem("account.theme") || t; } catch (e) {}
document.documentElement.setAttribute("data-theme", t === "black" ? "black" : "cream"); })();</script>
<!-- the page's face, from this account (ui/tokens.css names every file): asked for at once, so the first paint is already in it -->
<link rel="preload" href="/fonts/manrope-v20-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/ui/tokens.css" />
<link rel="stylesheet" href="/ui/shell.css" />
<link rel="stylesheet" href="/account.css" />
<link rel="stylesheet" href="/ui/portfolio.css" />
<link rel="stylesheet" href="/ui/markets.css" />
<link rel="stylesheet" href="/ui/trade.css" />
</head>
<body>
<!-- the page's icons: stroke drawings of its own (no venue's or wallet's logo). icon("name") in ui/core.js draws one -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

<a class="skip" href="#main">Skip to the page</a>
<div class="app">
  <nav class="rail" aria-label="Main">
    <a class="brand" href="#/portfolio"><span class="brand-mark" aria-hidden="true">A</span><span>Account</span></a>
    <div class="rail-nav">
      <span class="rail-pill" aria-hidden="true" hidden></span>
      <a href="#/markets" data-tab="markets"><svg class="ico" aria-hidden="true"><use href="#i-markets"></use></svg>Markets</a>
      <a href="#/trade" data-tab="trade"><svg class="ico" aria-hidden="true"><use href="#i-ticket"></use></svg>Trade</a>
    </div>
    <div class="rail-links">
      <button type="button" id="open-agents"><svg class="ico" aria-hidden="true"><use href="#i-agent"></use></svg>Agents<span class="count" id="count-agents" hidden></span></button>
    </div>
    <div class="rail-foot">
      <div class="rail-status"><div id="reach" hidden></div><div class="dim stamp" id="stamp"></div></div>
      <!-- the Account at the rail's foot: Portfolio · Venues · Memory open from here (round 7, F5) -->
      <a class="rail-wallet" href="#/portfolio" id="rail-wallet"><svg class="ico" aria-hidden="true"><use href="#i-purse"></use></svg><span class="rw"><span class="rw-h">Account<span class="count" id="count-portfolio" hidden></span></span><span class="rw-sub" id="rail-worth">&nbsp;</span></span></a>
    </div>
  </nav>

  <main class="main" id="main" tabindex="-1" aria-busy="true" data-at="account">
    <header class="topbar">
      <div class="acct-h" data-only="account">Account</div>
      <button type="button" class="lens" id="lens" aria-haspopup="menu" aria-expanded="false" aria-controls="lens-menu"><span id="lens-name">All accounts</span><svg class="ico sm" aria-hidden="true"><use href="#i-chevron"></use></svg></button>
      <div class="menu" id="lens-menu" role="menu" aria-label="Show" hidden></div>
      <div class="top-tools">
        <div class="acct-tools" data-only="account">
          <div class="seg" role="group" aria-label="Mode" id="mode"><button type="button" data-set-mode="guard" aria-pressed="false">Guard</button><button type="button" data-set-mode="open" aria-pressed="false">Beast</button></div>
          <button type="button" class="icon-btn" id="mode-more" aria-label="What changes between Guard and Beast" title="What changes between Guard and Beast"><svg class="ico" aria-hidden="true"><use href="#i-info"></use></svg></button>
          <div id="writes"></div>
          <button type="button" class="btn btn-sm" id="open-settings">Settings</button>
        </div>
        <form class="search" id="search-form" role="search" data-live data-only="trading"><svg class="ico" aria-hidden="true"><use href="#i-search"></use></svg><label class="sr" for="search">Search markets, assets, agents</label><input type="search" id="search" placeholder="Search markets, assets, agents" autocomplete="off" spellcheck="false" /><kbd aria-hidden="true">/</kbd></form>
        <button type="button" class="icon-btn" id="open-statement" aria-label="Statement" title="Statement"><svg class="ico lg" aria-hidden="true"><use href="#i-clock"></use></svg></button>
      </div>
    </header>
    <nav class="acct-tabs" data-only="account" aria-label="Account">
      <div class="seg"><a href="#/portfolio" data-acct="portfolio">Portfolio</a><a href="#/venues" data-acct="venues">Venues</a><a href="#/memory" data-acct="memory">Memory</a></div>
      <span class="note-s dim" id="mode-note"></span>
    </nav>
    <div class="banner" id="banner" hidden></div>
    <div class="notice" id="restored" hidden></div>

    <div class="panes">
    <section class="pane" data-pane="portfolio" aria-labelledby="h-portfolio"><h1 class="sr" id="h-portfolio">Portfolio</h1><div id="pane-portfolio"><div class="skel-rows" aria-hidden="true"><span class="skel big"></span><span class="skel"></span><span class="skel"></span><span class="skel" style="width:60%"></span></div></div></section>
    <section class="pane" data-pane="venues" aria-labelledby="h-venues" hidden><h1 class="sr" id="h-venues">Venues</h1><div id="pane-venues"><div class="skel-rows" aria-hidden="true"><span class="skel"></span><span class="skel"></span><span class="skel" style="width:60%"></span></div></div></section>
    <section class="pane" data-pane="memory" aria-labelledby="h-memory" hidden><h1 class="sr" id="h-memory">Memory</h1><div id="pane-memory"><div class="skel-rows" aria-hidden="true"><span class="skel"></span><span class="skel"></span><span class="skel" style="width:60%"></span></div></div></section>
    <section class="pane" data-pane="markets" aria-labelledby="h-markets" hidden><h1 class="sr" id="h-markets">Markets</h1><div id="pane-markets"><div class="skel-rows" aria-hidden="true"><span class="skel"></span><span class="skel"></span><span class="skel" style="width:60%"></span></div></div></section>
    <section class="pane" data-pane="trade" aria-labelledby="h-trade" hidden><h1 class="sr" id="h-trade">Trade</h1><div id="pane-trade"><div class="skel-rows" aria-hidden="true"><span class="skel"></span><span class="skel"></span><span class="skel" style="width:60%"></span></div></div></section>
    </div>
  </main>
</div>

<!-- the one sheet (openSheet draws into #sheet; an earlier dialog draws straight into #modal-form), the drawer on the right, the small asking dialog -->
<dialog id="modal"><div id="sheet"></div><form method="dialog" id="modal-form"></form></dialog>
<dialog id="drawer"></dialog>
<dialog id="ask" aria-labelledby="ask-title"></dialog>
<div class="toast-stack" popover="manual"><div id="toasts" role="status" aria-live="polite"></div><div id="alerts" role="alert" aria-live="assertive"></div></div>

<script src="/owner.js"></script>
<!-- one global scope, run in this order once the page is parsed (owner.js above runs first): ui/core.js holds the contract between them -->
<script defer src="/ui/core.js"></script>
<script defer src="/ui/connect.js"></script>
<script defer src="/ui/money.js"></script>
<script defer src="/ui/asset.js"></script>
<script defer src="/ui/intent.js"></script>
<script defer src="/ui/portfolio.js"></script>
<script defer src="/ui/memory.js"></script>
<script defer src="/ui/earn.js"></script>
<script defer src="/ui/markets.js"></script>
<script defer src="/ui/trade.js"></script>
<script defer src="/ui/statement.js"></script>
<script defer src="/ui/agents-mount.js"></script>
<script defer src="/ui/shell.js"></script>
</body>
</html>
