<!doctype html>
<html lang="en" data-theme="cream">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Account</title>
<script>/* the background before the first paint: Cream, unless this browser chose Black */
(function () { var t = "cream"; try { t = localStorage.getItem("account.theme") || t; } catch (e) {}
document.documentElement.setAttribute("data-theme", t === "black" ? "black" : "cream"); })();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="/ui/tokens.css" />
<link rel="stylesheet" href="/ui/shell.css" />
<link rel="stylesheet" href="/account.css" />
<link rel="stylesheet" href="/ui/portfolio.css" />
<link rel="stylesheet" href="/ui/markets.css" />
<link rel="stylesheet" href="/ui/trade.css" />
</head>
<body>
<!-- the page's icons: stroke drawings of its own (no venue's or wallet's logo). icon("name") in ui/core.js draws one -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4z" /><path d="M10 20v-6h4v6" /></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="m15.5 8.5-2 5-5 2 2-5z" /></symbol>
  <symbol id="i-trade" viewBox="0 0 24 24"><path d="M7 4v16M7 4 4 7M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3" /></symbol>
  <symbol id="i-agent" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3" /><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6" /></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V6a2 2 0 0 1 2-2h8" /></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4 2.4 5 5.6.8-4 3.9.9 5.5L12 16.6 7.1 19.2l.9-5.5-4-3.9 5.6-.8z" /></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
  <symbol id="i-receive" viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M5 20h14" /></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3" /></symbol>
  <symbol id="i-perps" viewBox="0 0 24 24"><path d="M4 18 9 12l4 3 7-9" /><path d="M15 6h5v5" /></symbol>
  <symbol id="i-prediction" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 12 16 8" /><path d="M12 7v1M7 12h1M16.5 12h.5" /></symbol>
  <symbol id="i-sellmany" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6" /><path d="m17 15 3 3-3 3" /></symbol>
  <symbol id="i-earn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9 15l6-6" /><circle cx="9.5" cy="9.5" r="0.6" /><circle cx="14.5" cy="14.5" r="0.6" /></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5" /><path d="M4 17v3h16v-3" /></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V4h10v5" /><rect x="4" y="9" width="16" height="8" rx="1" /><path d="M7 14h10v6H7z" /></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" /></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 14v5H5V6h5" /></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z" /><path d="M12 9v4M12 17h.01" /></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2" /><path d="M3 10h18M16 14h2" /></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0z" /><path d="M12 16v5" /></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16" /><path d="m7 15 4-4 3 3 5-6" /></symbol>
</svg>
<a class="skip" href="#main">Skip to the page</a>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand">Account</div>
    <button type="button" class="btn btn-primary rail-trade" id="rail-trade"><svg class="ico" aria-hidden="true"><use href="#i-plus"></use></svg>Trade</button>
    <div class="rail-nav">
      <a href="#/portfolio" data-tab="portfolio"><svg class="ico" aria-hidden="true"><use href="#i-home"></use></svg>Portfolio<span class="count" id="count-portfolio" hidden></span></a>
      <a href="#/markets" data-tab="markets"><svg class="ico" aria-hidden="true"><use href="#i-compass"></use></svg>Markets</a>
      <a href="#/trade" data-tab="trade"><svg class="ico" aria-hidden="true"><use href="#i-trade"></use></svg>Trade</a>
    </div>
    <div class="rail-foot">
      <div class="group">
        <div class="label" id="bg-label">Background</div>
        <div class="seg" role="group" aria-labelledby="bg-label"><button type="button" data-set-theme="cream" aria-pressed="true"><span class="swatch" style="background:#f6f4ef" aria-hidden="true"></span>Cream</button><button type="button" data-set-theme="black" aria-pressed="false"><span class="swatch" style="background:#0e0f11" aria-hidden="true"></span>Black</button></div>
      </div>
      <div class="group">
        <div class="label" id="mode-label">Mode</div>
        <div class="seg" role="group" aria-labelledby="mode-label" id="mode"><button type="button" data-set-mode="guard" aria-pressed="false">Conservative</button><button type="button" data-set-mode="open" aria-pressed="false">Aggressive</button></div>
        <div class="note-s" id="mode-note"></div>
      </div>
      <div class="rail-links">
        <button type="button" id="open-agents"><svg class="ico" aria-hidden="true"><use href="#i-agent"></use></svg>Agents<span class="count" id="count-agents" hidden></span></button>
        <button type="button" id="open-settings"><svg class="ico" aria-hidden="true"><use href="#i-sliders"></use></svg>Settings</button>
      </div>
      <div class="rail-status"><div id="writes"></div><div class="dim stamp" id="stamp"></div></div>
    </div>
  </nav>

  <main class="main" id="main" tabindex="-1" aria-busy="true">
    <header class="topbar">
      <button type="button" class="lens" id="lens" aria-haspopup="menu" aria-expanded="false" aria-controls="lens-menu"><span id="lens-name">All accounts</span><svg class="ico sm" aria-hidden="true"><use href="#i-chevron"></use></svg></button>
      <div class="menu" id="lens-menu" role="menu" aria-label="Show" hidden></div>
      <div class="top-tools">
        <form class="search" id="search-form" role="search" data-live><svg class="ico" aria-hidden="true"><use href="#i-search"></use></svg><label class="sr" for="search">Search markets, assets, agents</label><input type="search" id="search" placeholder="Search markets, assets, agents" autocomplete="off" spellcheck="false" /><kbd aria-hidden="true">/</kbd></form>
        <button type="button" class="icon-btn" id="open-statement" aria-label="Statement" title="Statement"><svg class="ico lg" aria-hidden="true"><use href="#i-clock"></use></svg></button>
        <button type="button" class="icon-btn" id="copy-setup" aria-label="Copy agent setup command" title="Copy agent setup command"><svg class="ico lg" aria-hidden="true"><use href="#i-copy"></use></svg></button>
        <button type="button" class="icon-btn" id="open-menu" aria-label="Menu" title="Menu" aria-haspopup="dialog"><svg class="ico lg" aria-hidden="true"><use href="#i-menu"></use></svg></button>
      </div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <div class="notice" id="restored" hidden></div>

    <section class="pane" data-pane="portfolio" aria-labelledby="h-portfolio"><h1 class="sr" id="h-portfolio">Portfolio</h1><div id="pane-portfolio"><div class="skel-rows" aria-hidden="true"><span class="skel big"></span><span class="skel"></span><span class="skel"></span><span class="skel" style="width:60%"></span></div></div></section>
    <section class="pane" data-pane="markets" aria-labelledby="h-markets" hidden><h1 class="sr" id="h-markets">Markets</h1><div id="pane-markets"><div class="skel-rows" aria-hidden="true"><span class="skel"></span><span class="skel"></span><span class="skel" style="width:60%"></span></div></div></section>
    <section class="pane" data-pane="trade" aria-labelledby="h-trade" hidden><h1 class="sr" id="h-trade">Trade</h1><div id="pane-trade"><div class="skel-rows" aria-hidden="true"><span class="skel"></span><span class="skel"></span><span class="skel" style="width:60%"></span></div></div></section>
  </main>
</div>

<!-- the one sheet (openSheet draws into #sheet; an earlier dialog draws straight into #modal-form), the drawer on the right, the small asking dialog -->
<dialog id="modal"><div id="sheet"></div><form method="dialog" id="modal-form"></form></dialog>
<dialog id="drawer"></dialog>
<dialog id="ask"></dialog>
<div class="toast-stack" popover="manual"><div id="toasts" role="status" aria-live="polite"></div><div id="alerts" role="alert" aria-live="assertive"></div></div>

<script src="/owner.js"></script>
<!-- one global scope, run in this order once the page is parsed (owner.js above runs first): ui/core.js holds the contract between them -->
<script defer src="/ui/core.js"></script>
<script defer src="/ui/connect.js"></script>
<script defer src="/ui/money.js"></script>
<script defer src="/ui/asset.js"></script>
<script defer src="/ui/intent.js"></script>
<script defer src="/ui/portfolio.js"></script>
<script defer src="/ui/markets.js"></script>
<script defer src="/ui/trade.js"></script>
<script defer src="/ui/statement.js"></script>
<script defer src="/ui/agents-mount.js"></script>
<script defer src="/ui/shell.js"></script>
</body>
</html>
