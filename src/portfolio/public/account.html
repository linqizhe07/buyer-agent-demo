<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Account · agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" />
<link rel="stylesheet" href="/portfolio.css" />
<link rel="stylesheet" href="/account.css" />
</head>
<body>
<main>
  <header class="top">
    <div>
      <nav class="pages"><a href="/">Statement</a><a href="/account" aria-current="page">Account</a></nav>
      <div class="mono dim" id="stamp">—</div>
    </div>
    <div class="modes">
      <div class="seg" id="mode"><button type="button" data-mode="open" aria-pressed="false">Open</button><button type="button" data-mode="guard" aria-pressed="false">Guard</button></div>
      <div class="mono dim small" id="mode-note"></div>
    </div>
  </header>

  <section class="head">
    <div>
      <div class="num" id="total">—</div>
      <div class="sub dim" id="sub">—</div>
    </div>
    <div class="acts" id="acts">
      <button type="button" class="ink" data-act="deposit">Deposit</button>
      <button type="button" data-act="withdraw">Withdraw</button>
      <button type="button" data-act="transfer">Transfer</button>
      <button type="button" data-act="swap">Swap</button>
      <button type="button" data-act="send">Send</button>
    </div>
  </section>

  <section class="kind">
    <div class="seg" id="type"><button type="button" data-type="disabled" aria-pressed="false">Separate</button><button type="button" data-type="unifiedAccount" aria-pressed="false">Unified</button></div>
    <span class="dim small" id="type-note"></span>
  </section>

  <div class="banner" id="banner" hidden></div>
  <section id="waiting" hidden></section>

  <section>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="panel"></div>
  </section>

  <footer class="mono dim small" id="foot"></footer>
</main>

<dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>

<script src="/owner.js"></script>
<script src="/account.js"></script>
</body>
</html>
