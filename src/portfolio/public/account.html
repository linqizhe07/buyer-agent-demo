<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" />
<link rel="stylesheet" href="/portfolio.css" />
<link rel="stylesheet" href="/account.css" />
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1 class="brand">Account</h1>
      <div class="mono dim" id="stamp">—</div>
    </div>
    <div class="modes">
      <div class="seg" id="mode"><button type="button" data-mode="guard" aria-pressed="false">Conservative</button><button type="button" data-mode="open" aria-pressed="false">Aggressive</button></div>
      <div class="dim small" id="mode-note"></div>
      <div id="writes"></div>
    </div>
  </header>

  <section class="head">
    <div>
      <div class="num" id="total">—</div>
      <div class="sub dim" id="sub">—</div>
    </div>
    <button type="button" class="ink" id="connect">Connect an account</button>
  </section>

  <section class="alloc" id="alloc" hidden>
    <div class="bar" id="alloc-bar"></div>
    <div class="legend mono" id="alloc-legend"></div>
  </section>

  <div class="banner" id="banner" hidden></div>
  <div class="msg" id="flash"></div>
  <section id="waiting" hidden></section>

  <section><h2 class="sec">Accounts <span class="tools" id="accounts-tools"></span></h2><div id="accounts"></div></section>
  <section id="orders-sec" hidden><h2 class="sec">Orders <span class="tools" id="orders-tools"></span></h2><div id="orders"></div></section>
  <section id="activity-sec"><h2 class="sec">Transfers <span class="tools" id="activity-tools"></span></h2><div id="activity"></div></section>
  <section><h2 class="sec">Agents</h2><div id="agents"></div></section>
  <section><h2 class="sec">Devices</h2><div id="devices"></div></section>
</main>

<dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>

<script src="/owner.js"></script>
<script src="/account.js"></script>
</body>
</html>
